<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FitForge — AI Fitness Coach</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

html,body{margin:0; padding:0; background:#0D0F12; min-height:100%;}
#ff-root{
  --bg:#0D0F12; --surface:#17191D; --surface2:#1E2126; --surface3:#25282E;
  --line:#2B2E34; --chalk:#F5F3EE; --steel:#9298A3; --steel-dim:#63676F;
  --ember:#FF5B2E; --ember-dim:#7A2E19; --iron:#5E8FD1; --iron-dim:#233752;
  --ok:#4CAF7D;
  font-family:'Inter',sans-serif; color:var(--chalk); background:var(--bg);
  max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
}
#ff-root *{box-sizing:border-box;}
#ff-root .disp{font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px;}
#ff-root .mono{font-family:'JetBrains Mono',monospace;}
#ff-root button{font-family:inherit; cursor:pointer;}
#ff-root .scroll{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}
#ff-root .scroll::-webkit-scrollbar{width:6px;}
#ff-root .scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
#ff-root .tag{display:inline-block; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600; letter-spacing:0.3px;}
#ff-root .card{background:var(--surface); border:1px solid var(--line); border-radius:12px;}
#ff-root .btn{background:var(--surface2); border:1px solid var(--line); color:var(--chalk); border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600; transition:background .15s;}
#ff-root .btn:hover{background:var(--surface3);}
#ff-root .btn-ember{background:var(--ember); border-color:var(--ember); color:#1A0A04;}
#ff-root .btn-ember:hover{background:#ff6f47;}
#ff-root .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px; background:none; border:none; color:var(--steel-dim); font-size:10px; font-weight:600;}
#ff-root .navbtn.active{color:var(--ember);}
#ff-root ::placeholder{color:var(--steel-dim);}
#ff-root input,#ff-root textarea{background:var(--surface2); border:1px solid var(--line); color:var(--chalk); border-radius:8px; padding:9px 10px; font-size:14px; width:100%;}
#ff-root .platebar{display:flex; gap:3px;}
#ff-root .plate{width:6px; height:16px; background:var(--iron); border-radius:1px;}
@keyframes ffPulse{0%{transform:scale(0.85); opacity:0.7;} 50%{transform:scale(1.15); opacity:1;} 100%{transform:scale(0.85); opacity:0.7;}}
</style>

function todayId(){
  var idx = new Date().getDay();
  return ['sun','mon','tue','wed','thu','fri','sat'][idx];
}
function dayById(id){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].id===id) return DAYS[i]; }

async function sget(key,fallback){
  try{ var v = localStorage.getItem(key); return v!==null? JSON.parse(v): fallback; }
  catch(e){ return fallback; }
}
async function sset(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

var DB = {completed:{}, prs:[], bodylog:[], usedMsg:{before:[],during:[],after:[],missed:[]}};

async function loadDB(){
  DB.completed = await sget('ff:completed', {});
  DB.prs = await sget('ff:prs', []);
  DB.bodylog = await sget('ff:bodylog', []);
  DB.usedMsg = await sget('ff:usedmsg', {before:[],during:[],after:[],missed:[]});
}
async function saveCompleted(){ await sset('ff:completed', DB.completed); }
async function savePrs(){ await sset('ff:prs', DB.prs); }
async function saveBodylog(){ await sset('ff:bodylog', DB.bodylog); }
async function saveUsedMsg(){ await sset('ff:usedmsg', DB.usedMsg); }

function pickMessage(phase, dayLabel, muscle){
  var pool = MOTIVATION[phase];
  var used = DB.usedMsg[phase] || [];
  if(used.length >= pool.length) used = [];
  var avail = [];
  for(var i=0;i<pool.length;i++) if(used.indexOf(i)===-1) avail.push(i);
  var pick = avail[Math.floor(Math.random()*avail.length)];
  used.push(pick);
  DB.usedMsg[phase] = used;
  saveUsedMsg();
  return pool[pick].replace('{day}', dayLabel).replace('{muscle}', muscle);
}

function dateKey(d){ return d.toISOString().slice(0,10); }

function computeStreak(){
  var streak = 0;
  var d = new Date();
  while(true){
    var k = dateKey(d);
    var wd = d.getDay();
    var id = ['sun','mon','tue','wed','thu','fri','sat'][wd];
    if(id==='sun'){ d.setDate(d.getDate()-1); continue; }
    if(DB.completed[k]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function esc(s){ return (s+'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function plateBar(n){
  var h='<div class="platebar">';
  for(var i=0;i<Math.min(n,6);i++) h+='<div class="plate"></div>';
  h+='</div>';
  return h;
}

function parseSetCount(scheme){
  var m = scheme.match(/^(\d+)/);
  return m? parseInt(m[1]) : 3;
}

function render(){
  var h = '';
  h += renderHeader();
  h += '<div class="scroll" style="padding:16px;">';
  if(state.tab==='dashboard') h += renderDashboard();
  else if(state.tab==='week') h += renderWeek();
  else if(state.tab==='day') h += renderDay();
  else if(state.tab==='exercise') h += renderExercise();
  else if(state.tab==='library') h += renderLibrary();
  else if(state.tab==='progress') h += renderProgress();
  else if(state.tab==='coach') h += renderCoach();
  h += '</div>';
  h += renderNav();
  root.innerHTML = h;
  attachHandlers();
}

function renderHeader(){
  return '<div style="padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;">'+
    '<div class="disp" style="font-size:22px; color:var(--chalk);">FIT<span style="color:var(--ember);">FORGE</span></div>'+
    '<div class="mono" style="font-size:12px; color:var(--steel);">'+new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</div>'+
    '</div>';
}

function renderNav(){
  var tabs = [['dashboard','ti-flame','Today'],['week','ti-calendar','Week'],['library','ti-search','Library'],['progress','ti-chart-bar','Progress'],['coach','ti-message-circle','Coach']];
  var h = '<div style="display:flex; border-top:1px solid var(--line); background:var(--surface);">';
  tabs.forEach(function(t){
    h += '<button class="navbtn'+(state.tab===t[0]?' active':'')+'" data-act="tab" data-tab="'+t[0]+'"><i class="ti '+t[1]+'" style="font-size:18px;"></i>'+t[2]+'</button>';
  });
  h += '</div>';
  return h;
}

function isStandaloneMode(){

function weekDone(dayId){
  var now = new Date();
  var dow = now.getDay();
  var target = ['sun','mon','tue','wed','thu','fri','sat'].indexOf(dayId);
  var diff = target - dow;
  var d = new Date(now); d.setDate(now.getDate()+diff);
  return !!DB.completed[dateKey(d)];
}

function uniqueMusclesForDay(dayId){
  var set=[], seen={};

    KB[ex[0]].primary.forEach(function(m){ if(!seen[m]){seen[m]=1; set.push(m);} });
  });
  return set;
}

function coachReply(q){
  var lower = q.toLowerCase();
  var id = todayId();
  var day = dayById(id);
  if(lower.indexOf('today')>-1 || lower.indexOf('workout')>-1){
    if(day.rest) return 'Today is rest day. Focus on sleep, hydration, and light stretching \u2014 growth happens during recovery.';
    var list = SCHEDULE[id].map(function(e){return e[1];}).join(', ');
    return day.label+' is '+day.name+': '+list+'. Open the Week tab for full sets and reps.';
  }
  if(lower.indexOf('how am i') > -1 || lower.indexOf('doing')>-1 || lower.indexOf('progress')>-1){
    var streak = computeStreak();
    return streak>0 ? ('You\u2019re on a '+streak+'-day streak. Keep the intensity up and don\u2019t skip your rest day.') : 'No active streak right now \u2014 today\u2019s a good day to start one.';
  }
  if(lower.indexOf('missed')>-1){
    return 'One missed session doesn\u2019t define your progress. Pick up today\u2019s workout and keep moving \u2014 consistency over perfection.';
  }
  if(lower.indexOf('form')>-1 || lower.indexOf('tip')>-1){
    return 'Biggest general form rule: control the eccentric (lowering) phase on every lift. Speed comes from strength, not the other way around. Open any exercise page for a full technique breakdown.';
  }
  return 'I can help with today\u2019s workout, your progress, form cues, or getting back on track after a missed day \u2014 ask away.';
}

function attachHandlers(){
  var els = root.querySelectorAll('[data-act]');
  els.forEach(function(el){
    el.addEventListener('click', function(){
      var act = el.getAttribute('data-act');
      if(act==='tab'){ state.tab = el.getAttribute('data-tab'); render(); }
      else if(act==='open-day'){ state.dayId = el.getAttribute('data-day'); state.tab='day'; render(); }
      else if(act==='open-ex'){
        state.exId = {id:el.getAttribute('data-ex'), name:el.getAttribute('data-name'), scheme:el.getAttribute('data-scheme'), day:el.getAttribute('data-day')};
        state.tab='exercise'; state.muscleView='front'; render();
      }
      else if(act==='muscle-view'){ state.muscleView = el.getAttribute('data-view'); render(); }
      else if(act==='toggle-complete'){
        var k = dateKey(new Date());
        if(DB.completed[k]) delete DB.completed[k]; else DB.completed[k]=true;
        saveCompleted(); render();
      }
      else if(act==='log-pr'){
        var w = root.querySelector('#ff-pr-weight').value;
        if(w){ DB.prs.push({name:el.getAttribute('data-name'), weight:w, date:dateKey(new Date())}); savePrs(); render(); }
      }
      else if(act==='log-bw'){
        var w2 = root.querySelector('#ff-bw').value;
        if(w2){ DB.bodylog.push({weight:w2, date:dateKey(new Date())}); saveBodylog(); render(); }
      }
      else if(act==='coach-chip'){
        var q = el.getAttribute('data-q');
        state.coachLog.push({from:'user', text:q});
        state.coachLog.push({from:'coach', text:coachReply(q)});
        render();
      }
      else if(act==='coach-send'){
        var inp = root.querySelector('#ff-coach-input');
        var val = inp.value.trim();
        if(val){ state.coachLog.push({from:'user', text:val}); state.coachLog.push({from:'coach', text:coachReply(val)}); render(); }
      }
      else if(act==='install-app'){
        if(deferredInstallPrompt){
          deferredInstallPrompt.prompt();
          deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt = null; });
        }
      }
      else if(act==='dismiss-install'){ state.installDismissed = true; render(); }
    });
  });
  var search = root.querySelector('#ff-search');
  if(search){
    search.addEventListener('input', function(){ state.query = search.value; render(); setTimeout(function(){ var s2 = root.querySelector('#ff-search'); if(s2){ s2.focus(); s2.selectionStart = s2.selectionEnd = s2.value.length; } },0); });
  }
  var coachInput = root.querySelector('#ff-coach-input');
  if(coachInput){
    coachInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ root.querySelector('[data-act="coach-send"]').click(); } });
  }
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}

(async function init(){
  root.innerHTML = '<div style="padding:40px; text-align:center; color:var(--steel);">Loading\u2026</div>';
  await loadDB();
  render();
})();
})();
</script>
</body>
</html>
